# Based on https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Multiple Platform IRLC Build

on:
  push:
    branches: [ "main", "software", "interface-refactor" ]
  pull_request:
    branches: [ "main", "software" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - os: windows-latest
            build_type: Release
            # `cl` (not `msvc`) so CMake/Ninja picks up the MSVC toolchain.
            c_compiler: cl
            cxx: cl

          - os: ubuntu-latest
            c_compiler: gcc
            cxx: g++

          - os: ubuntu-latest
            c_compiler: clang
            cxx: clang++

          - os: macos-latest
            c_compiler: clang
            cxx: clang++

        exclude:
          - os: macos-latest
            c_compiler: gcc

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "source-dir=${{ github.workspace }}/software/irlc" >> "$GITHUB_OUTPUT"
        echo "build-output-dir=${{ github.workspace }}/software/irlc/build/" >> "$GITHUB_OUTPUT"
        echo "cpm-dir=$HOME/cpm-cache" >> "$GITHUB_OUTPUT"
        # The Visual Studio generator silently ignores CMAKE_<LANG>_COMPILER_LAUNCHER,
        # so ccache never wraps cl.exe. Ninja honors it. Leave other platforms on
        # their default (Makefiles) generator.
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          echo "generator-arg=-G Ninja" >> "$GITHUB_OUTPUT"
        else
          echo "generator-arg=" >> "$GITHUB_OUTPUT"
        fi

    - name: Set CPM dir
      shell: bash
      run: echo "CPM_SOURCE_CACHE=$HOME/cpm-cache" >> $GITHUB_ENV

    # First, cache downloaded deps
    - name: Set up cache
      id: cache-cpm
      uses: actions/cache@v4
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: ${{ runner.os }}-cpm-${{ hashFiles('**/') }}
        restore-keys: |
          ${{ runner.os }}-cpm-

    # Now we get ccache
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2

    # Ninja needs cl.exe on PATH; the VS generator normally arranges this itself.
    - name: Setup MSVC environment
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        ${{ steps.strings.outputs.generator-arg }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -S ${{ steps.strings.outputs.source-dir }}

    - name: Build
      # --config is only meaningful for multi-config generators; Windows now uses
      # Ninja (single-config, set via CMAKE_BUILD_TYPE), where it is ignored.
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. --build-config is only
      # meaningful for multi-config generators and is ignored by Ninja.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: examples-${{ matrix.os }}-${{ matrix.c_compiler }}
        # There is no `irlc` executable anymore (it is an INTERFACE library), so
        # ship the example executables instead. Add patterns here as more
        # examples are introduced.
        path: |
          ${{ steps.strings.outputs.build-output-dir }}examples/**/*.exe
          ${{ steps.strings.outputs.build-output-dir }}examples/**/xbar-cli
