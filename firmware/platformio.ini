; --------------------------------
; --    ENVIRONMENT CONFIGS     --
; --------------------------------

[env]
build_src_flags = -Wall -Wextra -Werror -Wduplicated-cond -Wduplicated-branches -Wlogical-op -Wnull-dereference -Wshadow -Wvla -Wswitch-enum -Winvalid-pch -Wstack-usage=1024
debug_build_flags = -O0 -g -ggdb
custom_nanopb_project_dir = $PROJECT_DIR/../proto/
custom_nanopb_protos = +<*.proto>
lib_deps = https://github.com/nanopb/nanopb.git

; --------------------------
; --    BOARD CONFIGS     --
; --------------------------

; Motherboard config
[env:motherboard]
extends = rp2350
build_src_filter = -<*> +<motherboard/*> +<common/*>

; Daughterboard Config 
[env:daughterboard]
extends = stm32f4
build_src_filter = -<*> +<daughterboard/*> +<common/*> +<boards/stm32f4_nucleo/*>
build_flags = ${stm32f4.build_flags} -Iinclude/boards/stm32f4_nucleo

; Legacy Config
; Original IRLTSPICE Board from Senior Design
[env:legacy]
extends = stm32f0
build_src_filter = -<*> +<legacy/*>
build_flags = ${stm32f0.build_flags} -Iinclude/legacy
build_src_flags = ${stm32f0.build_src_flags} -O0
upload_command = openocd -f openocd.cfg -c "program .pio/build/legacy/firmware.elf verify reset exit"

; Native config - used for unit testing
[env:native]
platform = native
build_type = test
lib_deps = throwtheswitch/Unity, https://github.com/nanopb/nanopb.git
custom_nanopb_project_dir = $PROJECT_DIR/../proto/
custom_nanopb_protos = +<*.proto>
test_build_src = yes
build_src_filter = -<*> +<common/*>

; Chip Testing
[env:chip_test]
extends = env:motherboard
build_src_filter = -<*> +<chip_test/*> +<common/*>

; -------------------------------
; --     PLATFORM CONFIGS      --
; -------------------------------

; STM Configs
; Used in legacy design and could be useful for daughterboards
[stm32f0]
platform = ststm32
board = nucleo_f091rc
framework = stm32cube
build_flags = -D STM32F091xc
debug_server = 
    ${platformio.packages_dir}/tool-openocd/bin/openocd
    -f
    openocd_f0.cfg
build_src_flags = -DSTM32F091
upload_protocol = stlink
debug_init_break = tbreak main
board_build.f_cpu = 48000000L
monitor_speed = 115200
monitor_eol = LF

[stm32f4]
extends = stm32f0
board = nucleo_f446re
build_flags = -D STM32F446xx
debug_server = 
    ${platformio.packages_dir}/tool-openocd/bin/openocd
    -f
    openocd_f4.cfg
board_build.f_cpu = 180000000L
build_src_flags = -DSTM32F446

; RP Configs
[rp2350]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200
